apiVersion: ops.frz.io/v1alpha1
kind: OpsdConfig

socket:
  path: /run/opsd/opsd.sock
  mode: "0660"

database:
  path: /var/lib/opsd/opsd.db

runtime:
  workDirectory: /var/lib/opsd/work
  logDirectory: /var/log/opsd
  workers: 2

execution:
  defaultTimeoutSeconds: 30
  maxOutputBytes: 65536
  allowedPaths:
    - /bin
    - /usr/bin
    - /usr/local/bin
  sensitiveEnvKeys:
    - TOKEN

artifactStore:
  root: /var/lib/opsd/artifacts
  fileMode: "0640"
  dirMode: "0750"
  # 1 MiB 是为 1a/1b 的小制品设的；1c 的 runtime 验证要让 manifest 声明一个真实存在的
  # 制品，而那个制品就是探针二进制本身（约 3.5 MiB），因此放宽到 8 MiB。
  # quotaBytes 未变，仍在 16 MiB 上兜底。
  maxUploadBytes: 8388608
  quotaBytes: 16777216

secrets:
  allowedFileDirectories:
    - /etc/opsd/secrets

sudo:
  allowedCommands: []
